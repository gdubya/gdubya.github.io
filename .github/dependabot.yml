version: 2
updates:
  # Ruby gems (Gemfile / Gemfile.lock). The live site is built and deployed
  # from this repo's own Gemfile.lock via GitHub Actions, so these bumps
  # affect both local `bundle exec jekyll serve` previews and production.
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # One PR for the whole transitive tree instead of ~20 separate ones.
      jekyll-and-deps:
        patterns:
          - "*"

  # Keep the action versions in .github/workflows pinned to something current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
