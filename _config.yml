# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: G-Web
email: gareth@garethwestern.com
description: >- # this means to ignore newlines until "baseurl:"
        Gareth Western's blog — notes on data platforms, cloud and CI/CD.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://garethwestern.com"
github_username:  gdubya
logo: images/gareth.jpg
feed:
  path: atom.xml
locale: en-GB
read_time: true
# No `mastodon:` key -- the account is no longer used, so the theme's rel="me"
# profile link is gone. .well-known/webfinger is deliberately kept, so the
# domain still resolves as a fediverse alias if the account is ever revived.

# Build settings
remote_theme: "mmistakes/so-simple-theme@3.2.0"
skin: "/assets/css/skins/light.css"
google_fonts:
  - name: "Source Sans Pro"
    weights: "400,400i,700,700i"
  - name: "Lora"
    weights: "400,400i,700,700i"

# Search
search_full_content: true

# Front Matter Defaults
defaults:
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
      share: true

# Only plugins on the GitHub Pages allow-list will actually run on the live
# site: https://pages.github.com/versions/
# ("jekyll-paginated" used to be listed here -- no such gem exists, and the
# home layout uses `limit` rather than pagination, so it has been dropped.)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-gist
  - jekyll-remote-theme

collections:
  posts:
    output: true
    permalink: /posts/:year/:month/:day/:title/

# Footer Links
footer_links:
  - title: Feed
    url: atom.xml
    icon: fas fa-rss-square
  - title: GitHub
    url: https://github.com/gdubya
    icon: fab fa-github-square
  - title: LinkedIn
    url: https://linkedin.com/in/gwestern
    icon: fab fa-linkedin
  - title: BlueSky
    url: https://bsky.app/profile/garethwestern.com
    icon: fa-brands fa-bluesky
# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Careful: GitHub Pages enables jekyll-optional-front-matter, so any stray .md
# file in the repo -- even without front matter, even in a subdirectory --
# becomes a published page. Add such files to an `exclude:` list here (entries
# are added to Jekyll's internal default list, not a replacement for it), or
# better, keep them out of the repo altogether.

# Include these files/folders that are excluded by default
include: [ "/.well-known" ]
