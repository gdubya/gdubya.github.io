# The Site Configuration
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage › http://www.lingoes.net/en/translator/langcode.htm
# If it has the same name as one of the files in folder `_data/locales`, the layout language will also be changed,
# otherwise, the layout language will use the default value of 'en'.
lang: en-GB

# Without this, Jekyll uses the build machine's timezone -- UTC on GitHub Pages,
# but local time when previewing. A post written after 22:00 local then lands on
# the previous day in production and gets a different permalink to the one you
# saw locally. Pinning it keeps local, CI and production builds identical.
timezone: Europe/Oslo

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: G-Web # the main title

tagline: Notes on data platforms, cloud and CI/CD # it will display as the subtitle

description: >- # used by seo meta and the atom feed
  Gareth Western's blog — notes on data platforms, cloud and CI/CD.

# Fill in the protocol & hostname for your site.
# E.g. 'https://username.github.io', note that it does not end with a '/'.
url: "https://garethwestern.com"

github:
  username: gdubya

social:
  # Change to your full name.
  # It will be displayed as the default author of the posts and the copyright owner in the Footer
  name: Gareth Western
  email: gareth@garethwestern.com
  # No `fediverse_handle` -- the mastodon account is no longer used, so the
  # theme's rel="me" profile link is gone. .well-known/webfinger is
  # deliberately kept, so the domain still resolves as a fediverse alias if
  # the account is ever revived.
  fediverse_handle:
  links:
    # The first element serves as the copyright owner's link
    - https://github.com/gdubya
    - https://linkedin.com/in/gwestern
    - https://bsky.app/profile/garethwestern.com

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# the avatar on sidebar, support local or CORS resources
avatar: /images/gareth.jpg

# boolean type, the global switch for TOC in posts.
toc: true

comments:
  # Global switch for the post-comment system. Keeping it empty means disabled.
  provider:

pwa:
  enabled: true # The option for PWA feature (installable)
  cache:
    enabled: true # The option for PWA offline cache

paginate: 10

# The base URL of your site
baseurl: "" # the subpath of your site, e.g. /blog

# jekyll-redirect-from isn't a runtime dependency of the Chirpy theme gem, so
# it needs to be listed explicitly here to be auto-required by Jekyll. It
# lets old date-based post URLs (from before this migration) keep resolving
# via `redirect_from:` front matter, now that posts use /posts/:title/.
plugins:
  - jekyll-redirect-from

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge Options › https://github.com/jneen/rouge#full-options
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

# Front Matter Defaults
defaults:
  - scope:
      path: "" # An empty string here means all files in the project
      type: posts
    values:
      layout: post
      comments: true # Enable comments in posts.
      toc: true # Display TOC column in posts.
      # DO NOT modify the following parameter unless you are confident enough
      # to update the code of all other post links in this project.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # see `site.collections`
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
exclude:
  - "*.gem"
  - "*.gemspec"
  - tools
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache/
  - .jekyll-cache/

# Include these files/folders that are excluded by default
include:
  - "/.well-known"
